<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- iPhone 15 Pro Dynamic Island 및 Safe Area 대응 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>최적화된 모바일 달력</title>
  <style>
    :root {
      --primary-blue: #007AFF; /* iOS 파란색 */
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --text-color: #000000;
      --border-color: #E5E5EA;
      --bar-height: 22px;
      --bar-gap: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      /* Safe Area 여백 적용 */
      padding-top: env(safe-area-inset-top);
      height: 100dvh;
      overflow: hidden;
    }

    /* 전체 애플리케이션 레이아웃 */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* 1. 상단 헤더 및 메뉴 (X 버튼 완전 제거) */
    .header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .view-toggle {
      display: flex;
      gap: 8px;
    }

    .btn-tab {
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #8E8E93;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-tab.active {
      color: var(--primary-blue);
      border-bottom: 2px solid var(--primary-blue);
    }

    /* 설정/메뉴 패널 (X 버튼을 제거하고 깔끔한 백드롭 및 뒤로가기/바깥 클릭 제어) */
    .menu-panel {
      background-color: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .menu-title {
      font-size: 14px;
      font-weight: 600;
      color: #666;
    }

    /* 2. 월간/주간 하단 카테고리 추가 라인 제거 처리 */
    .category-add-bar,
    .category-line {
      display: none !important;
    }

    /* 3. 메인 스크롤 영역 (iPhone 15 Pro 세로 스크롤 및 밑 일정 확인) */
    .calendar-scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* iOS 터치 스크롤 최적화 */
      touch-action: pan-y;
      padding-bottom: calc(60px + env(safe-area-inset-bottom)); /* 하단 홈 바 가림 방지 */
    }

    /* 달력 그리드 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .day-header {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 0;
      color: #8E8E93;
      border-bottom: 1px solid var(--border-color);
    }

    .day-cell {
      min-height: 110px;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 4px 2px;
      position: relative;
    }

    .day-number {
      font-size: 12px;
      font-weight: 500;
      margin-left: 4px;
      margin-bottom: 4px;
    }

    /* 4. 긴 일정 막대 연결 최적화 (끊김 현상 방지) */
    .events-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--bar-gap);
    }

    .schedule-bar {
      height: var(--bar-height);
      background-color: var(--primary-blue);
      color: #FFFFFF;
      font-size: 11px;
      line-height: var(--bar-height);
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      -webkit-font-smoothing: antialiased;
      
      /* 이음새 매끄럽게 처리 */
      border-radius: 0;
      margin-left: 0;
      margin-right: 0;
    }

    /* 긴 일정의 시작점과 끝점에만 라운딩 처리 */
    .schedule-bar.is-start {
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
      margin-left: 2px;
    }

    .schedule-bar.is-end {
      border-top-right-radius: 6px;
      border-bottom-right-radius: 6px;
      margin-right: 2px;
    }

    /* 5. 파란색 삭제 버튼 (images/trash.png 마스킹) */
    .btn-delete {
      width: 16px;
      height: 16px;
      min-width: 16px;
      background-color: #FFFFFF; /* 이미지 마스크 내부는 흰색 아이콘 연출 */
      border: none;
      cursor: pointer;
      
      -webkit-mask-image: url('images/trash.png');
      mask-image: url('images/trash.png');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    /* 6. 메인 UI 좌측 하단 + 버튼 완전 제거 */
    .bottom-left-plus,
    .fab-add-button {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 헤더 -->
    <header class="header">
      <div class="view-toggle">
        <button class="btn-tab active">월간</button>
        <button class="btn-tab">주간</button>
      </div>
      <div style="font-weight: 700;">2026. 08</div>
    </header>

    <!-- 설정 및 메뉴 (X 버튼 없음) -->
    <div class="menu-panel">
      <span class="menu-title">⚙️ 일정 관리 설정</span>
      <!-- X 버튼이 제거된 상태입니다 -->
    </div>

    <!-- 스크롤 가능한 메인 달력 영역 -->
    <main class="calendar-scroll-area">
      <div class="calendar-grid" id="calendarGrid">
        <!-- 요일 헤더 -->
        <div class="day-header">일</div>
        <div class="day-header">월</div>
        <div class="day-header">화</div>
        <div class="day-header">수</div>
        <div class="day-header">목</div>
        <div class="day-header">금</div>
        <div class="day-header">토</div>

        <!-- 일자 셀들이 JS에 의해 동적으로 생성됩니다 -->
      </div>
    </main>
  </div>

  <script>
    // 1. 샘플 일정 데이터 (기간이 긴 일정 포함)
    const mockEvents = [
      { id: 1, title: "여름 휴가 여행", startDate: "2026-08-03", endDate: "2026-08-07" },
      { id: 2, title: "팀 프로젝트 스프린트", startDate: "2026-08-04", endDate: "2026-08-06" },
      { id: 3, title: "치과 예약", startDate: "2026-08-04", endDate: "2026-08-04" },
      { id: 4, title: "하반기 워크샵", startDate: "2026-08-10", endDate: "2026-08-14" },
      { id: 5, title: "코드 리뷰 및 최적화", startDate: "2026-08-12", endDate: "2026-08-18" }
    ];

    // 2. 탐욕적 레인 할당 알고리즘 (Greedy Lane Packing)
    // 아래로 불필요하게 밀리는 현상을 방지하고, 빈 레인을 재활용하여 촘촘하게 배치합니다.
    function optimizeScheduleLanes(events) {
      // 시작일 오름차순 -> 기간 내림차순 정렬
      const sorted = [...events].sort((a, b) => {
        const startDiff = new Date(a.startDate) - new Date(b.startDate);
        if (startDiff !== 0) return startDiff;
        return (new Date(b.endDate) - new Date(b.startDate)) - (new Date(a.endDate) - new Date(a.startDate));
      });

      const lanes = [];

      return sorted.map(event => {
        const start = new Date(event.startDate).getTime();
        const end = new Date(event.endDate).getTime();
        let assignedLane = -1;

        for (let i = 0; i < lanes.length; i++) {
          if (lanes[i] < start) {
            assignedLane = i;
            break;
          }
        }

        if (assignedLane === -1) {
          lanes.push(end);
          assignedLane = lanes.length - 1;
        } else {
          lanes[assignedLane] = end;
        }

        return { ...event, laneIndex: assignedLane };
      });
    }

    // 3. 달력 그리드 생성 및 이벤트 렌더링
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const optimizedEvents = optimizeScheduleLanes(mockEvents);

      // 2026년 8월 기준 (31일)
      for (let day = 1; day <= 31; day++) {
        const dateStr = `2026-08-${String(day).padStart(2, '0')}`;
        const dayCell = document.createElement('div');
        dayCell.className = 'day-cell';
        
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = day;
        dayCell.appendChild(dayNumber);

        const eventsContainer = document.createElement('div');
        eventsContainer.className = 'events-container';

        // 해당 날짜에 걸쳐 있는 이벤트 찾기
        const dayEvents = optimizedEvents.filter(e => dateStr >= e.startDate && dateStr <= e.endDate);
        
        // 레인 순서에 맞춰 정렬
        dayEvents.sort((a, b) => a.laneIndex - b.laneIndex);

        dayEvents.forEach(e => {
          const isStart = dateStr === e.startDate;
          const isEnd = dateStr === e.endDate;

          const bar = document.createElement('div');
          bar.className = `schedule-bar ${isStart ? 'is-start' : ''} ${isEnd ? 'is-end' : ''}`;
          
          // 시작일인 경우에만 타이틀 표기
          const titleSpan = document.createElement('span');
          titleSpan.textContent = isStart ? e.title : '';
          bar.appendChild(titleSpan);

          // 삭제 버튼 추가 (파란색 배경에 trash.png 마스킹 처리됨)
          if (isEnd) {
            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.onclick = (ev) => {
              ev.stopPropagation();
              deleteEvent(e.id);
            };
            bar.appendChild(delBtn);
          }

          eventsContainer.appendChild(bar);
        });

        dayCell.appendChild(eventsContainer);
        grid.appendChild(dayCell);
      }
    }

    function deleteEvent(id) {
      const index = mockEvents.findIndex(e => e.id === id);
      if (index !== -1) {
        mockEvents.splice(index, 1);
        // 달력 재생성
        document.querySelectorAll('.day-cell').forEach(el => el.remove());
        renderCalendar();
      }
    }

    // 초기 실행
    document.addEventListener('DOMContentLoaded', renderCalendar);
  </script>
</body>
</html>
